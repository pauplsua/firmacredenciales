name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # Solo se publica lo que debe ser público. El código de Apps Script,
      # la documentación y el servidor local no salen al sitio web.
      - name: Preparar el sitio
        run: |
          mkdir -p _sitio
          cp index.html comprobar.html _sitio/
          cp -r assets _sitio/assets

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
